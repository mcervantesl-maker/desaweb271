<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de evidencias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .subtitulo {
            text-align: center;
            color: #666;
            margin-top: -10px;
            font-size: 1.1em;
        }
        .nombre {
            text-align: center;
            margin: 30px 0;
            padding: 15px;
            background-color: #fff;
            border: 2px dashed #3498db;
            border-radius: 8px;
        }
        .nombre label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #3498db;
        }
        .nombre input {
            width: 80%;
            padding: 8px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .contenido {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .indice {
            flex: 0 0 180px;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .indice h2 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.1em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        .indice ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .indice li {
            padding: 8px 0;
        }
        .indice a {
            text-decoration: none;
            color: #3498db;
        }
        .indice a:hover {
            text-decoration: underline;
        }
        .principal {
            flex: 1;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .principal section {
            margin-bottom: 30px;
        }
        .principal h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <h1>Portafolio de evidencias</h1>
    <p class="subtitulo">Materia: Desarrollo Web Básico</p>

    <div class="nombre">
        <label for="nombre">Mi nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre aquí">
    </div>

    <div class="contenido">
        <nav class="indice">
            <h2>Índice</h2>
            <ul>
                <li><a href="#parcial1">Parcial 1</a></li>
                <li><a href="#parcial2">Parcial 2</a></li>
                <li><a href="#parcial3">Parcial 3</a></li>
            </ul>
        </nav>

        <main class="principal">
            <section id="parcial1">
                <h2>Parcial 1</h2>
                <p>Contenido del Parcial 1.</p>
            </section>
            <section id="parcial2">
                <h2>Parcial 2</h2>
                <p>Contenido del Parcial 2.</p>
            </section>
            <section id="parcial3">
                <h2>Parcial 3</h2>
                <p>Contenido del Parcial 3.</p>
            </section>
        </main>
    </div>
</body>
</html>
